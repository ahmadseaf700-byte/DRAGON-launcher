name: Build DRAGON Launcher

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows installers
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install

      - name: Generate application icons
        run: npm run tauri -- icon src-tauri/icons/dragon.svg --output ./src-tauri/icons

      - name: Build Windows installers
        run: npm run tauri -- build

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: DRAGON-Windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14

  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libssl-dev libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0 ndk;26.1.10909125

      - name: Configure Android NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Setup Rust Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Install frontend dependencies
        run: npm install

      - name: Initialize Android project
        run: npm run tauri -- android init

      - name: Generate application icons
        run: npm run tauri -- icon src-tauri/icons/dragon.svg --output ./src-tauri/icons

      - name: Build Android APK
        run: npm run tauri -- android build --apk --target aarch64

      # A release APK must be signed with a persistent private keystore.
      # Configure the four ANDROID_SIGNING_* repository secrets before running this job.
      - name: Sign Android APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done

          APK="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' ! -name '*unsigned*' -o -type f -name '*unsigned*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "::error::Tauri did not produce an APK."
            exit 1
          fi

          mkdir -p signed-apk
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > dragon-release.keystore
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks dragon-release.keystore \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out signed-apk/DRAGON-Launcher.apk \
            "$APK"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose signed-apk/DRAGON-Launcher.apk
          rm -f dragon-release.keystore

      - name: Upload signed Android APK
        uses: actions/upload-artifact@v4
        with:
          name: DRAGON-Android-APK
          path: signed-apk/DRAGON-Launcher.apk
          if-no-files-found: error
          retention-days: 14
